<!doctype html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ačiū – RENGORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: rental catalogue — product grid with photo + price on every card, a running inquiry list instead of a cart */
:root{
  --paper:#F5F2EE; --card:#FFFFFF; --ink:#2B1F19; --espresso:#3B2A22; --brass:#9C7A45; --brass-soft:#E9DFCE;
  --muted:#7C6F65; --line:#E2D9CD; --on-dark:#F3EBDF;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:1.2rem; --s2:1.6rem; --s3:clamp(1.9rem,3.6vw,2.7rem); --s4:clamp(2.4rem,5.6vw,4.2rem);
  --wrap:1200px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1411; --card:#251B16; --ink:#F1E8DC; --espresso:#120D0B; --brass:#C9A86F; --brass-soft:#3A2C21;
  --muted:#AE9F92; --line:#3A2D25; --on-dark:#F3EBDF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1411; --card:#251B16; --ink:#F1E8DC; --espresso:#120D0B; --brass:#C9A86F; --brass-soft:#3A2C21;
  --muted:#AE9F92; --line:#3A2D25; --on-dark:#F3EBDF; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--espresso)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.1;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0}
section{padding-block:clamp(52px,8vw,96px)}
.head{display:grid;gap:10px;margin-bottom:clamp(24px,4vw,40px);max-width:680px}
.head h2{font-size:var(--s3)}
.head p{margin:0;color:var(--muted)}

/* top bar + header */
.topbar{background:var(--espresso);color:var(--on-dark);font-size:.8rem}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:space-between;padding-block:8px}
.topbar span{opacity:.85}
.topbar b{font-weight:600;user-select:all}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:.08em;text-decoration:none;color:var(--ink)}
.nav ul{display:flex;gap:24px;list-style:none;margin:0 0 0 auto;padding:0;font-size:.92rem}
.nav ul a{text-decoration:none;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.bag{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:600;font-size:.88rem;white-space:nowrap}
.bag i{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--brass);color:#fff;font-size:.75rem;font-variant-numeric:tabular-nums}
@media (max-width:860px){.nav ul{display:none}.bag{margin-left:auto}}

/* hero */
.hero{padding-block:clamp(32px,5vw,56px) clamp(40px,6vw,72px)}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{font-size:var(--s4);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero p.lede{font-size:1.15rem;color:var(--muted);max-width:40ch;margin:18px 0 26px}
.occasions{display:flex;flex-wrap:wrap;gap:8px}
.occasions a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.88rem;background:var(--card)}
.occasions a:hover{border-color:var(--brass)}
.hero-img{position:relative;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img .a{aspect-ratio:3/4}
.hero-img .stack{display:grid;gap:10px}
.hero-img .stack img{aspect-ratio:1/1}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}}

/* catalogue */
#katalogas{background:var(--card);border-block:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filters button{font:inherit;font-size:.88rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.prod{display:grid;grid-template-rows:auto 1fr;background:var(--paper);border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--brass-soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.prod:hover .ph img{transform:scale(1.04)}
.ph svg{position:absolute;inset:0;margin:auto;width:56%;height:56%;color:var(--brass)}
.ph .soon{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.75rem;color:var(--muted)}
.badge{position:absolute;top:12px;left:12px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 8px;background:var(--ink);color:var(--paper)}
.badge.new{background:var(--brass);color:#fff}
.pbody{display:grid;gap:8px;padding:16px;align-content:start}
.pbody h3{font-size:1.25rem}
.pbody .spec{margin:0;color:var(--muted);font-size:.88rem;min-height:2.6em}
.opt{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink)}
.opt input{accent-color:var(--brass);width:16px;height:16px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:1.45rem;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.price small{font-family:var(--body);font-size:.75rem;color:var(--muted);margin-left:3px}
.price.ask{font-size:1rem;font-family:var(--body);font-weight:600;color:var(--brass)}
.add{display:flex;align-items:center;gap:6px}
.qty{width:58px;font:inherit;font-size:.9rem;padding:7px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 12px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.big{padding:13px 20px;font-size:.95rem}
.added{font-size:.78rem;color:var(--brass);min-height:1.2em;margin:0}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:28px}
.svc div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border:1px dashed var(--line)}
.svc b{font-weight:600}
.svc span{font-family:var(--display);font-size:1.1rem;white-space:nowrap}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}

/* packages */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pack{background:var(--card);border:1px solid var(--line);padding:24px;display:grid;gap:12px;align-content:start}
.pack.best{border-color:var(--brass)}
.pack h3{font-size:var(--s2)}
.pack ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;color:var(--muted);font-size:.93rem}
.pack li::before{content:"—";color:var(--brass);margin-right:8px}
.pack .tot{display:flex;align-items:baseline;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pack .tot b{font-family:var(--display);font-size:2rem;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.pack .tot s,.pack .tot span{color:var(--muted);font-size:.85rem}
.pack .fine{margin:0;color:var(--muted);font-size:.8rem}
@media (max-width:900px){.packs{grid-template-columns:1fr;max-width:520px}}

/* gallery */
#darbai{background:var(--espresso);color:var(--on-dark)}
#darbai .head p{color:rgba(243,235,223,.7)}
#darbai .eyebrow{color:#C9A86F}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gal figure{margin:0;display:grid;gap:8px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.gal figcaption{font-size:.85rem;color:rgba(243,235,223,.7)}
@media (max-width:820px){.gal{grid-template-columns:repeat(2,1fr)}}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}
.steps li{display:grid;gap:6px;counter-increment:s;padding-top:14px;border-top:1px solid var(--ink)}
.steps li::before{content:"0" counter(s);font-family:var(--display);font-style:italic;color:var(--brass);font-size:1.4rem}
.steps p{margin:0;color:var(--muted);font-size:.93rem}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* inquiry */
#uzklausa{background:var(--card);border-top:1px solid var(--line)}
.inq{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);align-items:start}
.list{border:1px solid var(--line);background:var(--paper);min-width:0}
.list h3{font-size:1.3rem;padding:16px 18px;border-bottom:1px solid var(--line)}
.list ul{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:48px 1fr auto auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.list li img,.list li .ic{width:48px;height:48px;object-fit:cover;background:var(--brass-soft);display:block}
.list li .n{min-width:0}
.list li .n b{display:block;font-weight:600;font-size:.94rem}
.list li .n span{color:var(--muted);font-size:.8rem}
.list li .sum{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rm{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px}
.rm:hover{color:var(--ink)}
.empty{padding:28px 18px;color:var(--muted);margin:0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px;font-weight:600}
.total b{font-family:var(--display);font-size:1.6rem;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.total small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
form{display:grid;gap:14px;min-width:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-size:.84rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:11px 12px;width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--brass)}
.out{display:grid;gap:10px;padding:16px;border:1px dashed var(--brass)}
.out pre{white-space:pre-wrap;margin:0;font-family:var(--body);font-size:.88rem;user-select:all}
.out p{margin:0;color:var(--muted);font-size:.84rem}
.contacts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:6px;font-size:.95rem}
.contacts b{user-select:all}
@media (max-width:860px){.inq{grid-template-columns:1fr}}
@media (max-width:460px){.r2{grid-template-columns:1fr}.list li{grid-template-columns:40px 1fr auto}.list li .sum{display:none}}

footer{background:var(--espresso);color:rgba(243,235,223,.75);font-size:.82rem;padding-block:28px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between}
footer .logo{color:var(--on-dark);font-size:1.2rem}
</style></head><body>
<header><div class="wrap nav"><a class="logo" href="/">RENGORA</a></div></header>
<main><section class="hero"><div class="wrap" style="max-width:720px;display:grid;gap:18px">
<p class="eyebrow">Užklausa gauta</p><h1 style="font-size:var(--s3)">Ačiū! Netrukus susisieksime.</h1>
<p style="color:var(--muted);margin:0">Jei renginys skubus, skambinkite +370 639 11899.</p>
<p><a class="btn big" href="/">Grįžti į katalogą</a></p></div></section></main></body></html>
